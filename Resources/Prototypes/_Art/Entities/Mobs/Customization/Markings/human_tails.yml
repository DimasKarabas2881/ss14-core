# Cat
- type: marking
  id: CatTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Human]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
  sprites:
  - sprite: _Art/Mobs/Customization/human_cat_tails.rsi
    state: basic_tail_tip
  - sprite: _Art/Mobs/Customization/human_cat_tails.rsi
    state: basic_tail_stripes_even
  - sprite: _Art/Mobs/Customization/human_cat_tails.rsi
    state: basic_tail_stripes_odd
  emotes:
    - emotePrototype: Mew
      requiredMarkingsAny:
        - CatEarsBasic
        - CatEarsStubby
        - CatEarsCurled
        - CatEarsTorn
        - CatEarsDroopy
        - CatEarsTall
        - CatEarsFuzzy
    - emotePrototype: Meow
      requiredMarkingsAny:
        - CatEarsBasic
        - CatEarsStubby
        - CatEarsCurled
        - CatEarsTorn
        - CatEarsDroopy
        - CatEarsTall
        - CatEarsFuzzy
    - emotePrototype: Trill
      requiredMarkingsAny:
        - CatEarsBasic
        - CatEarsStubby
        - CatEarsCurled
        - CatEarsTorn
        - CatEarsDroopy
        - CatEarsTall
        - CatEarsFuzzy

