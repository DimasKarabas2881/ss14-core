# Cat
- type: marking
  id: CatEarsBasic
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Human]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SkinColoring
    layers:
      ears_basic_inner:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  sprites:
  - sprite: _Art/Mobs/Customization/human_top.rsi
    state: ears_basic_outer
  - sprite: _Art/Mobs/Customization/human_top.rsi
    state: ears_basic_inner

